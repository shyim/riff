[package]
name = "riff-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Composer-compatible PHP package manager implementation"

[dependencies]
# Internal crates
riff-semver = { path = "../riff-semver" }
riff-spdx = { path = "../riff-spdx" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "blocking", "rustls-tls"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
serde_yaml = "0.9"
rmp-serde = "1"
rkyv = "0.8"
jsonschema = { version = "0.50.1", default-features = false }

# Progress/Output
indicatif = "0.17"
console = "0.15"

# Archive handling
zip = "2"
tar = "0.4"
flate2 = { version = "1", features = ["zlib-rs"] }

# Filesystem
walkdir = "2"
memchr = "2"
simdutf8 = "0.1"
tempfile = "3"
directories = "5"
glob = "0.3"
globset = "0.4"
shellexpand = "3"
pathdiff = "0.2"
diffy = "0.5"

# Hashing
foldhash = "0.2"
hashbrown = "0.17"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
getrandom = "0.3"

# Additional compression
bzip2 = { version = "0.5", features = ["static"] }
xz2 = "0.1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
log = "0.4"

# Async traits
async-trait = "0.1"

# Regex
regex = "1"

# Ordered collections
indexmap = { version = "2", features = ["serde"] }
compact_str = { version = "0.10", features = ["serde"] }
smallvec = "1"

# URL handling
url = "2"
urlencoding = "2"

# Time
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
criterion = { version = "5", package = "codspeed-criterion-compat" }
proptest = "1"
tokio-test = "0.4"

[[bench]]
name = "solver"
harness = false

[[bench]]
name = "manifest"
harness = false
