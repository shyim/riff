<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" role="img" aria-labelledby="title description">
  <title id="title">Symfony Demo installation benchmark</title>
  <desc id="description">Riff 0.0.7 installs Symfony Demo in a median of 1,715 milliseconds with a cold package cache compared with Composer 2.10.3 at 7,797 milliseconds. With package archives cached, Riff takes 349 milliseconds and Composer takes 1,989 milliseconds.</desc>
  <rect width="900" height="510" fill="#0d1117" rx="16"/>
  <text x="48" y="62" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="28" font-weight="700">Symfony Demo · composer install</text>
  <text x="48" y="92" fill="#8b949e" font-family="system-ui, sans-serif" font-size="16">Lower is better · median wall-clock time in milliseconds</text>

  <g font-family="system-ui, sans-serif">
    <text x="48" y="144" fill="#f0f6fc" font-size="20" font-weight="700">Cold package cache · 3 runs</text>
    <text x="48" y="169" fill="#8b949e" font-size="14">ZIP archives downloaded</text>
    <line x1="225" y1="142" x2="840" y2="142" stroke="#30363d"/>
    <text x="225" y="128" fill="#8b949e" font-size="13">0 ms</text>
    <text x="530" y="128" fill="#8b949e" font-size="13">4,000 ms</text>
    <text x="830" y="128" fill="#8b949e" font-size="13" text-anchor="end">8,000 ms</text>
    <rect x="225" y="184" width="599" height="34" rx="6" fill="#8b949e"/>
    <text x="48" y="207" fill="#c9d1d9" font-size="16">Composer 2.10.3</text>
    <text x="814" y="207" fill="#f0f6fc" font-size="16" font-weight="700" text-anchor="end">7,797 ms</text>
    <rect x="225" y="234" width="132" height="34" rx="6" fill="#f97316"/>
    <text x="48" y="257" fill="#c9d1d9" font-size="16">Riff 0.0.7</text>
    <text x="369" y="257" fill="#f0f6fc" font-size="16" font-weight="700" text-anchor="start">1,715 ms</text>
    <text x="840" y="247" fill="#fb923c" font-size="17" font-weight="700" text-anchor="end">4.55× faster</text>

    <text x="48" y="323" fill="#f0f6fc" font-size="20" font-weight="700">Warm package cache · 5 runs</text>
    <text x="48" y="348" fill="#8b949e" font-size="14">Package archives already cached</text>
    <line x1="225" y1="321" x2="840" y2="321" stroke="#30363d"/>
    <text x="225" y="307" fill="#8b949e" font-size="13">0 ms</text>
    <text x="530" y="307" fill="#8b949e" font-size="13">1,000 ms</text>
    <text x="830" y="307" fill="#8b949e" font-size="13" text-anchor="end">2,000 ms</text>
    <rect x="225" y="363" width="612" height="34" rx="6" fill="#8b949e"/>
    <text x="48" y="386" fill="#c9d1d9" font-size="16">Composer 2.10.3</text>
    <text x="827" y="386" fill="#f0f6fc" font-size="16" font-weight="700" text-anchor="end">1,989 ms</text>
    <rect x="225" y="413" width="107" height="34" rx="6" fill="#f97316"/>
    <text x="48" y="436" fill="#c9d1d9" font-size="16">Riff 0.0.7</text>
    <text x="344" y="436" fill="#f0f6fc" font-size="16" font-weight="700" text-anchor="start">349 ms</text>
    <text x="840" y="426" fill="#fb923c" font-size="17" font-weight="700" text-anchor="end">5.69× faster</text>
  </g>

  <text x="48" y="482" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13">Symfony Demo 920d86dc · 153 packages · PHP 8.5.10 · measured 2026-09-12</text>
</svg>
