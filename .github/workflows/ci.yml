name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Rust quality components
        run: rustup component add clippy rustfmt --toolchain 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint workflows
        run: mise exec -- actionlint
      - name: Check Homebrew formula rendering
        run: make homebrew-formula-check
      - name: Check formatting
        run: make fmt
      - name: Run Clippy
        run: make clippy

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          tools: none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run workspace tests
        run: cargo test --workspace --all-targets --locked

  composer-compatibility:
    name: Composer compatibility inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      COMPOSER_SRC_DIR: ${{ github.workspace }}/composer-reference
    steps:
      - name: Check out Riff
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the Composer reference snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: composer/composer
          # Keep inventory counts stable until we deliberately refresh the porting snapshot.
          ref: eba7baa59eb1b59246cf9800b0120fe78915b6ac
          path: composer-reference
          persist-credentials: false
      - name: Validate Composer test inventories
        run: make composer-test-check

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build release binaries
        run: make release

  final:
    name: Final
    needs: [quality, test, composer-compatibility, release-build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Gate on upstream jobs
        env:
          COMPOSER_COMPATIBILITY: ${{ needs.composer-compatibility.result }}
          QUALITY: ${{ needs.quality.result }}
          RELEASE_BUILD: ${{ needs.release-build.result }}
          TEST: ${{ needs.test.result }}
        run: |
          failed=0
          for check in \
            "quality=$QUALITY" \
            "test=$TEST" \
            "composer-compatibility=$COMPOSER_COMPATIBILITY" \
            "release-build=$RELEASE_BUILD"
          do
            name=${check%%=*}
            result=${check#*=}
            if [ "$result" = success ]; then
              echo "::notice::$name: $result"
            else
              echo "::error::$name: $result"
              failed=1
            fi
          done
          exit "$failed"
