name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build without publishing
        required: true
        default: main
        type: string
      label:
        description: Archive version label for the dry run
        required: true
        default: dryrun
        type: string
      release:
        description: Publish the matching version tag instead of creating a dry-run bundle
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release input
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      checkout-ref: ${{ steps.release.outputs.checkout_ref }}
      is-release: ${{ steps.release.outputs.is_release }}
      label: ${{ steps.release.outputs.label }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          # The release ancestry check below fetches origin/main. Keep the
          # short-lived Actions token available for that fetch.
          persist-credentials: true
      - name: Validate tag and version
        id: release
        shell: bash
        env:
          DRY_RUN_LABEL: ${{ inputs.label }}
          MANUAL_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail

          version=$(cargo metadata --format-version 1 --no-deps |
            jq -r '.packages[] | select(.name == "riff") | .version')
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::Unable to resolve the riff package version"
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$MANUAL_RELEASE" = "true" ]; then
            tag=$GITHUB_REF_NAME
            if [ "$tag" != "v$version" ]; then
              echo "::error::Tag $tag does not match workspace version v$version"
              exit 1
            fi

            git fetch --no-tags origin main
            release_commit=$(git rev-parse HEAD)
            if ! git merge-base --is-ancestor "$release_commit" origin/main; then
              echo "::error::Release tag must point to a commit contained in origin/main"
              exit 1
            fi

            checkout_ref=$release_commit
            is_release=true
            label=$tag
          else
            if ! [[ "$DRY_RUN_LABEL" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Dry-run label may contain only letters, numbers, dots, underscores, and hyphens"
              exit 1
            fi

            checkout_ref=$(git rev-parse HEAD)
            is_release=false
            label=$DRY_RUN_LABEL
          fi

          if [[ "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          {
            echo "checkout_ref=$checkout_ref"
            echo "is_release=$is_release"
            echo "label=$label"
            echo "prerelease=$prerelease"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  quality:
    name: Release quality gate
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.checkout-ref }}
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          tools: none
      - name: Install Rust quality components
        run: rustup component add clippy rustfmt --toolchain 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-quality
      - name: Check formatting
        run: make fmt
      - name: Run Clippy
        run: make clippy
      - name: Run workspace tests
        run: make test

  prepare-release:
    name: Prepare draft release
    needs: [validate, quality]
    if: ${{ needs.validate.outputs.is-release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create or verify draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          TAG: ${{ needs.validate.outputs.label }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG is already published and cannot be replaced"
              exit 1
            fi
            echo "Reusing existing draft release $TAG"
            exit 0
          fi

          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "$TAG")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"

  build:
    name: Build (${{ matrix.target }})
    needs: [validate, quality, prepare-release]
    if: >-
      ${{ always() && needs.validate.result == 'success' && needs.quality.result == 'success' &&
          (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            build-tool: cross
            archive: tar.gz
            runnable: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            build-tool: cross
            archive: tar.gz
            runnable: false
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            build-tool: cross
            archive: tar.gz
            runnable: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            build-tool: cross
            archive: tar.gz
            runnable: false
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            build-tool: cargo
            archive: tar.gz
            runnable: true
          - target: aarch64-apple-darwin
            runner: macos-latest
            build-tool: cargo
            archive: tar.gz
            runnable: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            build-tool: cargo
            archive: zip
            runnable: true
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            build-tool: cargo
            archive: zip
            runnable: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      ARCHIVE_NAME: riff-${{ needs.validate.outputs.label }}-${{ matrix.target }}.${{ matrix.archive }}
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.checkout-ref }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.target }}
      - name: Install Cross
        if: matrix.build-tool == 'cross'
        run: cargo install cross --version 0.2.5 --locked
      - name: Install Rust target
        if: matrix.build-tool == 'cargo'
        run: rustup target add ${{ matrix.target }} --toolchain 1.98.0
      - name: Build Unix binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          BUILD_TOOL: ${{ matrix.build-tool }}
        run: |
          set -euo pipefail
          "$BUILD_TOOL" build --release --locked --target "$TARGET" --package riff --bin riff
          file "target/$TARGET/release/riff"
      - name: Build Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked --target $env:TARGET --package riff --bin riff
          if (-not (Test-Path "target/$env:TARGET/release/riff.exe")) {
            throw "Release binary was not produced"
          }
      - name: Smoke-test Unix binary
        if: runner.os != 'Windows' && matrix.runnable
        shell: bash
        run: |
          set -euo pipefail
          "target/$TARGET/release/riff" --version | grep -F "$VERSION"
      - name: Smoke-test Windows binary
        if: runner.os == 'Windows' && matrix.runnable
        shell: pwsh
        run: |
          $versionOutput = & "target/$env:TARGET/release/riff.exe" --version
          if ($versionOutput -notmatch [regex]::Escape($env:VERSION)) {
            throw "Version output '$versionOutput' does not contain $env:VERSION"
          }
      - name: Archive Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/$ARCHIVE_NAME" -C "target/$TARGET/release" riff
          contents=$(tar -tzf "dist/$ARCHIVE_NAME")
          if [ "$contents" != "riff" ]; then
            echo "::error::Unexpected archive contents: $contents"
            exit 1
          fi
      - name: Archive Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/$env:TARGET/release/riff.exe" -DestinationPath "dist/$env:ARCHIVE_NAME"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead("dist/$env:ARCHIVE_NAME")
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName })
            if ($entries.Count -ne 1 -or $entries[0] -ne "riff.exe") {
              throw "Unexpected archive contents: $($entries -join ', ')"
            }
          } finally {
            $archive.Dispose()
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ env.ARCHIVE_NAME }}
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package (${{ matrix.nfpm-arch }})
    needs: [validate, quality, prepare-release, build]
    if: >-
      ${{ always() && needs.validate.result == 'success' && needs.quality.result == 'success' &&
          needs.build.result == 'success' &&
          (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            nfpm-arch: amd64
            deb-arch: amd64
            rpm-arch: x86_64
          - target: aarch64-unknown-linux-gnu
            nfpm-arch: arm64
            deb-arch: arm64
            rpm-arch: aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DEBIAN_SMOKE_IMAGE: docker.io/library/debian@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171
      NFPM_ARCH: ${{ matrix.nfpm-arch }}
      NFPM_IMAGE: ghcr.io/goreleaser/nfpm@sha256:a662cb167d7b6d3a83920c83d76b12d02b8ac5dd2c13e5c62c15270b23f6df0c
      RPM_SMOKE_IMAGE: docker.io/library/rockylinux@sha256:305de618a5681ff75b1d608fd22b10f362867dff2f550a4f1d427d21cd7f42b4
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.checkout-ref }}
          persist-credentials: false
      - name: Download target binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-${{ matrix.target }}
          path: dist
      - name: Download host binary for completion generation
        if: matrix.nfpm-arch != 'amd64'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-x86_64-unknown-linux-gnu
          path: host-dist
      - name: Prepare package root
        shell: bash
        env:
          LABEL: ${{ needs.validate.outputs.label }}
        run: |
          set -euo pipefail

          mkdir -p \
            package-root/usr/bin \
            package-root/usr/share/bash-completion/completions \
            package-root/usr/share/fish/vendor_completions.d \
            package-root/usr/share/zsh/site-functions
          tar -xzf "dist/riff-${LABEL}-${TARGET}.tar.gz" -C package-root/usr/bin
          chmod 0755 package-root/usr/bin/riff

          completion_binary=package-root/usr/bin/riff
          if [ "$NFPM_ARCH" != amd64 ]; then
            mkdir -p host-bin
            tar -xzf "host-dist/riff-${LABEL}-x86_64-unknown-linux-gnu.tar.gz" -C host-bin
            completion_binary=host-bin/riff
          fi

          "$completion_binary" completion bash > package-root/usr/share/bash-completion/completions/riff
          "$completion_binary" completion zsh > package-root/usr/share/zsh/site-functions/_riff
          "$completion_binary" completion fish > package-root/usr/share/fish/vendor_completions.d/riff.fish
          chmod 0644 \
            package-root/usr/share/bash-completion/completions/riff \
            package-root/usr/share/fish/vendor_completions.d/riff.fish \
            package-root/usr/share/zsh/site-functions/_riff
      - name: Build deb and rpm packages
        shell: bash
        env:
          DEB_ARCH: ${{ matrix.deb-arch }}
          RPM_ARCH: ${{ matrix.rpm-arch }}
        run: |
          set -euo pipefail

          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          deb_package="php-riff_${VERSION}-1_${DEB_ARCH}.deb"
          rpm_package="php-riff-${VERSION}-1.${RPM_ARCH}.rpm"

          for package in \
            "deb:$deb_package" \
            "rpm:$rpm_package"
          do
            packager=${package%%:*}
            target=${package#*:}
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              --env NFPM_ARCH \
              --env SOURCE_DATE_EPOCH \
              --env VERSION \
              --volume "$PWD:/workspace" \
              --workdir /workspace \
              "$NFPM_IMAGE" package \
              --config packaging/nfpm/nfpm.yaml \
              --packager "$packager" \
              --target "dist/$target"
          done

          test -f "dist/$deb_package"
          test -f "dist/$rpm_package"
      - name: Validate package metadata and contents
        shell: bash
        env:
          DEB_ARCH: ${{ matrix.deb-arch }}
          RPM_ARCH: ${{ matrix.rpm-arch }}
        run: |
          set -euo pipefail

          deb_package="php-riff_${VERSION}-1_${DEB_ARCH}.deb"
          rpm_package="php-riff-${VERSION}-1.${RPM_ARCH}.rpm"
          expected_package_version="${VERSION/-/~}-1"

          test "$(dpkg-deb --field "dist/$deb_package" Package)" = php-riff
          test "$(dpkg-deb --field "dist/$deb_package" Version)" = "$expected_package_version"
          test "$(dpkg-deb --field "dist/$deb_package" Architecture)" = "$DEB_ARCH"
          dpkg-deb --field "dist/$deb_package" Depends | grep -F 'php-cli (>= 7.2.5)'
          dpkg-deb --field "dist/$deb_package" Recommends | grep -Fx git
          dpkg-deb --contents "dist/$deb_package" | grep -F './usr/bin/riff'
          dpkg-deb --contents "dist/$deb_package" | grep -F './usr/share/bash-completion/completions/riff'

          mapfile -t rpm_fields < <(
            docker run --rm \
              --volume "$PWD/dist:/packages:ro" \
              "$RPM_SMOKE_IMAGE" \
              rpm -qp --queryformat '%{NAME}\n%{VERSION}-%{RELEASE}\n%{ARCH}\n' "/packages/$rpm_package"
          )
          test "${rpm_fields[0]}" = php-riff
          test "${rpm_fields[1]}" = "$expected_package_version"
          test "${rpm_fields[2]}" = "$RPM_ARCH"
          docker run --rm \
            --volume "$PWD/dist:/packages:ro" \
            "$RPM_SMOKE_IMAGE" \
            rpm -qp --requires "/packages/$rpm_package" | grep -F 'php-cli >= 7.2.5'
          docker run --rm \
            --volume "$PWD/dist:/packages:ro" \
            "$RPM_SMOKE_IMAGE" \
            rpm -qp --recommends "/packages/$rpm_package" | grep -Fx git
          docker run --rm \
            --volume "$PWD/dist:/packages:ro" \
            "$RPM_SMOKE_IMAGE" \
            rpm -qlp "/packages/$rpm_package" | grep -F '/usr/bin/riff'
      - name: Smoke-test package installation
        if: matrix.nfpm-arch == 'amd64'
        shell: bash
        env:
          DEB_PACKAGE: php-riff_${{ needs.validate.outputs.version }}-1_${{ matrix.deb-arch }}.deb
          RPM_PACKAGE: php-riff-${{ needs.validate.outputs.version }}-1.${{ matrix.rpm-arch }}.rpm
        run: |
          set -euo pipefail

          docker run --rm \
            --env DEB_PACKAGE \
            --env VERSION \
            --volume "$PWD/dist:/packages:ro" \
            "$DEBIAN_SMOKE_IMAGE" \
            sh -euc '
              apt-get update >/dev/null
              apt-get install --yes --no-install-recommends "/packages/$DEB_PACKAGE" >/dev/null
              riff --version | grep -F "$VERSION"
              test -f /usr/share/bash-completion/completions/riff
              test -f /usr/share/doc/php-riff/copyright
            '

          docker run --rm \
            --env RPM_PACKAGE \
            --env VERSION \
            --volume "$PWD/dist:/packages:ro" \
            "$RPM_SMOKE_IMAGE" \
            sh -euc '
              microdnf install --assumeyes php-cli >/dev/null
              rpm --install "/packages/$RPM_PACKAGE"
              riff --version | grep -F "$VERSION"
              test -f /usr/share/zsh/site-functions/_riff
              test -f /usr/share/licenses/php-riff/LICENSE
            '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-packages-${{ matrix.nfpm-arch }}
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [validate, quality, prepare-release, build, package]
    if: >-
      ${{ always() && needs.validate.result == 'success' && needs.quality.result == 'success' &&
          needs.build.result == 'success' && needs.package.result == 'success' &&
          (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify release bundle and write checksums
        shell: bash
        env:
          LABEL: ${{ needs.validate.outputs.label }}
        run: |
          set -euo pipefail

          targets=(
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
            x86_64-unknown-linux-musl
            aarch64-unknown-linux-musl
            x86_64-apple-darwin
            aarch64-apple-darwin
            x86_64-pc-windows-msvc
            aarch64-pc-windows-msvc
          )
          for target in "${targets[@]}"; do
            extension=tar.gz
            if [[ "$target" == *-windows-* ]]; then
              extension=zip
            fi
            test -f "dist/riff-${LABEL}-${target}.${extension}"
          done

          packages=(
            "php-riff_${{ needs.validate.outputs.version }}-1_amd64.deb"
            "php-riff_${{ needs.validate.outputs.version }}-1_arm64.deb"
            "php-riff-${{ needs.validate.outputs.version }}-1.x86_64.rpm"
            "php-riff-${{ needs.validate.outputs.version }}-1.aarch64.rpm"
          )
          for package in "${packages[@]}"; do
            test -f "dist/$package"
          done

          count=$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
          if [ "$count" -ne 8 ]; then
            echo "::error::Expected 8 release archives, found $count"
            exit 1
          fi

          package_count=$(find dist -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' \) | wc -l)
          if [ "$package_count" -ne 4 ]; then
            echo "::error::Expected 4 Linux packages, found $package_count"
            exit 1
          fi

          (
            cd dist
            sha256sum ./*.deb ./*.rpm ./*.tar.gz ./*.zip | sort -k2 > SHA256SUMS
          )
          cat dist/SHA256SUMS
      - name: Attest release bundle
        if: >-
          ${{ needs.validate.outputs.is-release == 'true' &&
              (github.event.repository.visibility == 'public' ||
               vars.ENABLE_PRIVATE_ATTESTATIONS == 'true') }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
      - name: Upload dry-run bundle
        if: needs.validate.outputs.is-release != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: riff-${{ needs.validate.outputs.label }}-release-bundle
          path: dist
          if-no-files-found: error
          retention-days: 7
      - name: Upload release assets
        if: needs.validate.outputs.is-release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.label }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish stable release
        if: >-
          ${{ needs.validate.outputs.is-release == 'true' &&
              needs.validate.outputs.prerelease != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.label }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Publish prerelease
        if: >-
          ${{ needs.validate.outputs.is-release == 'true' &&
              needs.validate.outputs.prerelease == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.label }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
